  <title>Портал сделок и проектов</title>
  <style>
    :root{font-family:Segoe UI,Arial,sans-serif;color:#f4f7f6;background:#071923;scroll-behavior:smooth}
    *{box-sizing:border-box} body{margin:0} button{font:inherit;cursor:pointer} button:focus-visible{outline:3px solid #40d6bf;outline-offset:3px}
    .shell{min-height:100svh;display:flex;flex-direction:column;background:radial-gradient(circle at 80% 10%,#173a48 0%,#071923 42%)}

    main{width:min(1240px,100%);margin:auto;padding:3rem max(1.5rem,4vw) 4rem}

    p{font-size:clamp(1.05rem,1.55vw,1.3rem);line-height:1.55;color:#d0dddd;max-width:65ch}

    .orb{aspect-ratio:1;max-width:430px;width:100%;position:relative;margin:auto;border:1px solid #40d6bf50;border-radius:50%;display:grid;place-items:center;box-shadow:0 0 80px #40d6bf1a inset,0 0 100px #40d6bf16}
    .orb:before,.orb:after{content:"";position:absolute;border:1px dashed #40d6bf50;border-radius:50%;inset:12%}.orb:after{inset:26%;border-style:solid}
    .orb-core{z-index:1;width:42%;aspect-ratio:1;border-radius:50%;background:#40d6bf;color:#071923;display:grid;place-items:center;font-size:clamp(1.1rem,2vw,1.6rem);font-weight:800;text-align:center;line-height:1.1;padding:1rem}
    .orb-tag{position:absolute;background:#102e3a;border:1px solid #336474;padding:.55rem .8rem;border-radius:.65rem;font-size:.82rem;color:#eaf4f1;z-index:2}.orb-tag.a{top:7%;left:4%}.orb-tag.b{right:-3%;top:24%}.orb-tag.c{bottom:9%;left:2%}.orb-tag.d{right:4%;bottom:15%}
    .story{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem;margin-top:2rem}.story-card{border:1px solid #ffffff2a;background:#112c37;border-radius:1rem;padding:1.1rem;min-height:12rem}.story-card strong{color:#40d6bf;font-size:.85rem}.story-card h3{font-size:1.15rem;line-height:1.2;margin:.8rem 0}.story-card p{font-size:.89rem;color:#abc2c4;margin:0}
    footer{display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:1rem max(1.5rem,4vw);border-top:1px solid #ffffff25}
    .progress{height:3px;background:#ffffff24;flex:1;max-width:260px;border-radius:3px;overflow:hidden}.progress>span{display:block;height:100%;background:#40d6bf;transition:width .25s}
    .nav{display:flex;gap:.6rem}.nav button{border:1px solid #54707b;background:transparent;color:#edf5f4;border-radius:999px;padding:.55rem .95rem;min-width:2.7rem}.nav button:hover{background:#1b3d49}.nav button:disabled{opacity:.4;cursor:default}
    .count{font-variant-numeric:tabular-nums;color:#a8bdbe;font-size:.9rem}
    a{color:#70e7d4;text-underline-offset:3px} a:hover{color:#b7fff0}
    .split{display:grid;grid-template-columns:1fr 1fr;gap:2rem;align-items:start}
    .wide{max-width:26ch}.lead{font-size:clamp(1.1rem,1.8vw,1.45rem);line-height:1.5;max-width:70ch}
    .tagline{font-size:.82rem;color:#8fb0b7;text-transform:uppercase;letter-spacing:.13em;font-weight:700;margin:0 0 .7rem}
    .panel{background:#102e3a;border:1px solid #375965;border-radius:1.1rem;padding:clamp(1.1rem,2.4vw,2rem)}
    .panel-light{background:#eef3ef;color:#0a2330;border-color:#eef3ef}.panel-light p,.panel-light .muted{color:#34505c}
    .panel h3{font-size:clamp(1.16rem,2vw,1.65rem);line-height:1.22;letter-spacing:-.025em;margin:.2rem 0 .7rem}.panel p{font-size:1rem;line-height:1.5;margin:.45rem 0}
    .muted{color:#9cb6b9}.mini{font-size:.84rem!important;line-height:1.45!important;color:#9cb6b9!important}
    .number{font-size:clamp(3rem,7vw,6.5rem);letter-spacing:-.09em;line-height:1;font-weight:800;color:#40d6bf}
    .grid3{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem}.grid4{display:grid;grid-template-columns:repeat(4,1fr);gap:1rem}
    .card{background:#102e3a;border:1px solid #375965;border-radius:1rem;padding:1.2rem;min-width:0}.card h3{font-size:1.13rem;margin:.25rem 0 .6rem}.card p{font-size:.96rem;line-height:1.48;margin:0}.card .k{font-size:.77rem;color:#40d6bf;text-transform:uppercase;letter-spacing:.12em;font-weight:700}
    .chips{display:flex;flex-wrap:wrap;gap:.55rem;margin:1rem 0}.chip{background:#ffffff0b;border:1px solid #5a7680;color:#f4f7f6;border-radius:999px;padding:.6rem .9rem;min-height:44px}.chip:hover,.chip[aria-pressed="true"]{background:#40d6bf;color:#08202a;border-color:#40d6bf}
    .demo{min-height:230px}.demo-k{font-size:.78rem;color:#40d6bf;letter-spacing:.14em;text-transform:uppercase;font-weight:700}.demo h3{font-size:clamp(1.4rem,2.4vw,2.1rem)}.demo p{max-width:62ch}
    .flow{display:grid;grid-template-columns:repeat(4,1fr);gap:.75rem;align-items:stretch;margin:2rem 0}.flow-item{position:relative;background:#10303a;border:1px solid #365d69;border-radius:1rem;padding:1.2rem;min-height:155px}.flow-item:after{content:'→';position:absolute;right:-.66rem;top:40%;z-index:2;color:#40d6bf;font-size:1.4rem}.flow-item:last-child:after{display:none}.flow-item b{font-size:1.15rem}.flow-item p{font-size:.92rem;margin:.6rem 0 0}.flow-no{color:#40d6bf;font-size:.78rem;font-weight:800;letter-spacing:.12em;display:block;margin-bottom:1.2rem}
    .quote{border-left:3px solid #40d6bf;padding:.55rem 0 .55rem 1.2rem;margin:1.2rem 0;font-size:clamp(1.2rem,2.2vw,1.8rem);line-height:1.4;max-width:55ch}
    .eyebrow2{font-size:.79rem;color:#83aeb3;text-transform:uppercase;letter-spacing:.11em;font-weight:700}
    .source-list{display:grid;grid-template-columns:1fr 1fr;gap:.6rem 1.5rem;margin-top:1.4rem}.source-list a{font-size:.93rem;line-height:1.4}
    .market-card{border-top:2px solid #40d6bf;padding-top:1rem}.market-card h3{font-size:1.2rem;margin:.4rem 0}.market-card p{font-size:.94rem}.market-card a{font-size:.85rem}
    .road{display:grid;grid-template-columns:repeat(3,1fr);gap:1rem;margin-top:1.8rem}.road .card{min-height:225px}.road big{font-size:2rem;color:#40d6bf;font-weight:800}
    .status-line{display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1rem}.status-line span{font-size:.83rem;border:1px solid #52757a;border-radius:999px;padding:.35rem .65rem;color:#c3d5d4}
    .callout{font-size:.9rem;color:#9fbdc0;border-top:1px solid #41606a;padding-top:1rem;margin-top:1.5rem;max-width:75ch;line-height:1.5}
    .jump{background:#0d2933;color:#e9f6f2;border:1px solid #456b75;border-radius:.5rem;padding:.42rem .55rem;max-width:220px;font:inherit;font-size:.84rem}
    .jump:focus-visible{outline:3px solid #40d6bf;outline-offset:2px}
    .two-way{display:grid;grid-template-columns:1fr 1fr;gap:1rem}.two-way .card{min-height:210px}
    .accent{color:#40d6bf}.orange{color:#ffc38d}
    @media(max-width:900px){.grid4,.flow{grid-template-columns:repeat(2,1fr)}.flow-item:nth-child(2):after{display:none}.road{grid-template-columns:1fr 1fr}}
    @media(max-width:760px){.hero,.split{grid-template-columns:1fr;gap:1rem}.orb{width:64%;min-width:230px}.story,.grid3{grid-template-columns:1fr 1fr}main{padding-top:2rem}.top-label{display:none}.source-list{grid-template-columns:1fr}}
    @media(max-width:510px){.story,.grid3,.grid4,.flow,.road,.two-way{grid-template-columns:1fr}.flow-item:after{display:none}.orb{display:none}footer{flex-wrap:wrap}.progress{order:3;flex-basis:100%;max-width:none}.hero-note{font-size:.88rem}.jump{max-width:150px}header{padding:.85rem 1rem}.brand span:last-child{font-size:.77rem}.card{padding:1rem}}

<body>
  <div class="shell">
    <header><div class="brand"><span class="brand-mark">P</span><span>ПОРТАЛ СДЕЛОК</span></div><select class="jump" id="jump" aria-label="Перейти к разделу"></select><div class="top-label">Концепция продукта · сентябрь 2026</div></header>
    <main id="stage" aria-live="polite"></main>
    <footer><div class="count" id="count"></div><div class="progress" aria-hidden="true"><span id="progress"></span></div><div class="nav"><button id="prev" aria-label="Предыдущий слайд">←</button><button id="next" aria-label="Следующий слайд">Далее →</button></div></footer>
  </div>
  <script>
    const slides=[
      {label:'Идея',html:`<div class="hero"><div><div class="eyebrow">Концепция продукта</div><h1>У каждой сделки должна быть память</h1><p>Переговоры живут в чатах, письмах, встречах и документах. Портал собирает их в одну проверяемую историю и связывает с решениями, поручениями и следующими шагами.</p><div class="hero-note"><span>01</span><span>Начинаем с одной сделки. Показываем, как команда видит её целиком, даже если работа идёт в нескольких привычных каналах.</span></div></div><div class="orb" aria-hidden="true"><div class="orb-core">Одна<br>сделка</div><span class="orb-tag a">Письма</span><span class="orb-tag b">Встречи</span><span class="orb-tag c">Документы</span><span class="orb-tag d">Решения</span></div></div>`},
      {label:'Проблема',html:`<div class="eyebrow">Проблема</div><h2>Работа идёт. Общая картина теряется.</h2><p>Представим совместный проект двух компаний. Условия меняются в письмах, документы расходятся по чатам, после встречи остаются разные версии договорённостей. Когда руководитель спрашивает «что согласовано?», ответ приходится собирать заново.</p><div class="story"><div class="story-card"><strong>ПОНЕДЕЛЬНИК</strong><h3>Первое предложение</h3><p>Условия отправлены по почте.</p></div><div class="story-card"><strong>СРЕДА</strong><h3>Поправка в чате</h3><p>Изменён срок, но документ прежний.</p></div><div class="story-card"><strong>ПЯТНИЦА</strong><h3>Звонок сторон</h3><p>Решение помнят по-разному.</p></div><div class="story-card"><strong>ЧЕРЕЗ МЕСЯЦ</strong><h3>Вопрос руководителя</h3><p>Кто и когда взял обязательство?</p></div></div>`},
      {label:'Одна сделка',html:`<div class="eyebrow">Интерактивный пример</div><h2>Проследим одну сделку по шагам</h2><p class="lead">Выберите событие. Портал показывает не только пересказ, но и происхождение каждого вывода.</p><div class="chips"><button class="chip" data-group="story" data-index="0">1. Письмо</button><button class="chip" data-group="story" data-index="1">2. Чат</button><button class="chip" data-group="story" data-index="2">3. Встреча</button><button class="chip" data-group="story" data-index="3">4. Решение</button></div><div class="panel demo" data-panel="story"></div><p class="mini">История вымышленная и служит только для демонстрации логики продукта.</p>`},
      {label:'Источники',html:`<div class="eyebrow">Вход информации</div><h2>Команда остаётся в привычных каналах</h2><p class="lead">Сначала подключаем четыре источника. Для каждого материала сохраняются дата, автор, место появления и исходный файл или сообщение.</p><div class="chips"><button class="chip" data-group="sources" data-index="0">Telegram</button><button class="chip" data-group="sources" data-index="1">Почта</button><button class="chip" data-group="sources" data-index="2">Zoom</button><button class="chip" data-group="sources" data-index="3">Заметка и диктофон</button></div><div class="panel demo" data-panel="sources"></div><div class="callout">Подключаются только разрешённые чаты, ящики и записи. Доступность старой истории и автоматической записи зависит от прав и возможностей каждого сервиса.</div>`},
      {label:'Обработка',html:`<div class="eyebrow">Как это работает</div><h2>Из разрозненных сообщений в связанную историю</h2><div class="flow"><div class="flow-item"><span class="flow-no">01 / ПОЛУЧИТЬ</span><b>Оригинал</b><p>Письмо, сообщение, файл, запись или заметка.</p></div><div class="flow-item"><span class="flow-no">02 / ПОМЕСТИТЬ</span><b>Время и теги</b><p>Сделка, тема, участники, этап, источник и права.</p></div><div class="flow-item"><span class="flow-no">03 / ПРОВЕРИТЬ</span><b>Статус сведений</b><p>Предложение, подтверждённый факт, решение или спорный пункт.</p></div><div class="flow-item"><span class="flow-no">04 / СВЯЗАТЬ</span><b>Рабочие регистры</b><p>Условия, поручения, сроки, документы и открытые вопросы.</p></div></div><div class="quote">Любой важный вывод можно открыть до первоисточника и увидеть, кто и когда его подтвердил.</div><p class="mini">Автоматические теги и проекты документов проверяет ответственный человек. Совпадения тегов недостаточно для признания договорённости согласованной.</p>`},
      {label:'Цикл встречи',html:`<div class="eyebrow">Рабочий ритм</div><h2>Каждая встреча готовит следующую</h2><p class="lead">Повестка и протокол входят в первую версию. Цикл превращает разговор в конкретные действия.</p><div class="chips"><button class="chip" data-group="meeting" data-index="0">Повестка</button><button class="chip" data-group="meeting" data-index="1">Встреча</button><button class="chip" data-group="meeting" data-index="2">Протокол</button><button class="chip" data-group="meeting" data-index="3">Поручения</button></div><div class="panel demo" data-panel="meeting"></div><div class="status-line"><span>Открытый вопрос</span><span>Ответственный</span><span>Срок</span><span>Ожидаемый результат</span><span>Следующая встреча</span></div>`},
      {label:'Результат',html:`<div class="eyebrow">Ценность для людей</div><h2>Одна база. Разные ответы.</h2><p class="lead">Выберите роль и посмотрите, какой рабочий результат она получает из той же истории сделки.</p><div class="chips"><button class="chip" data-group="roles" data-index="0">Руководитель</button><button class="chip" data-group="roles" data-index="1">Менеджер проекта</button><button class="chip" data-group="roles" data-index="2">Коммерческий блок</button><button class="chip" data-group="roles" data-index="3">Внешний партнёр</button></div><div class="panel demo" data-panel="roles"></div><div class="callout">Выводы могут быть управленческими, коммерческими, финансовыми или аналитическими. Неполные и расчётные сведения показываются как таковые, а объём ответа зависит от прав пользователя.</div>`},
      {label:'Два режима',html:`<div class="eyebrow">Как участвуют стороны</div><h2>Польза начинается и без второй стороны</h2><div class="two-way"><div class="card"><div class="k">РЕЖИМ 1</div><h3>Портал одной компании</h3><p>Компания ведёт свою историю сделки, контролирует сотрудников и готовит материалы. Контрагент продолжает общаться привычным способом.</p></div><div class="card"><div class="k">РЕЖИМ 2</div><h3>Общая площадка сделки</h3><p>Обе стороны входят в согласованное пространство. Общие условия и протоколы подтверждаются явно, внутренние слои каждой стороны остаются закрытыми.</p></div></div><div class="quote">При приглашении партнёра прошлые внутренние материалы не открываются автоматически.</div><p class="mini">Правила официальной коммуникации и записи обсуждений согласуются участниками. Материалы одной стороны не выдаются за совместно подтверждённые.</p>`},
      {label:'Агент и доступ',html:`<div class="eyebrow">Персональный помощник</div><h2>Спросить о сделке можно из рабочего окна</h2><p class="lead">Агент помогает искать, готовить письма и отчёты, но отвечает только в пределах прав конкретного участника. Проверьте на одном вопросе.</p><div class="chips"><button class="chip" data-group="access" data-index="0">Руководитель</button><button class="chip" data-group="access" data-index="1">Исполнитель</button><button class="chip" data-group="access" data-index="2">Приглашённый партнёр</button></div><div class="panel demo" data-panel="access"></div><div class="callout">На первом этапе это доступ через портал и привычные каналы. Запись звонков, водяные знаки и журнал действий требуют отдельной настройки и согласованных правил. Ни один портал не может полностью исключить фотографирование экрана.</div>`},
      {label:'Рынок',html:`<div class="eyebrow">Российский рынок</div><h2>Отдельные части уже стали продуктами</h2><p class="lead">Это подтверждает практическую задачу, но не доказывает спрос именно на наше объединение функций. Конкурировать придётся качеством связанной истории сделки.</p><div class="grid4"><div class="market-card"><div class="eyebrow2">CRM</div><h3>Клиенты и продажи</h3><p>Битрикс24 уже расшифровывает звонки и заполняет карточку сделки.</p><a href="https://helpdesk.bitrix24.ru/open/27105168/" target="_blank" rel="noopener noreferrer">Источник ↗</a></div><div class="market-card"><div class="eyebrow2">Встречи</div><h3>ИИ-протокол</h3><p>Контур.Толк выделяет решения, задачи, ответственных и сроки.</p><a href="https://kontur.ru/talk/spravka/80987-tolk_nauchilsya_gotovit_protokol_vstrechi" target="_blank" rel="noopener noreferrer">Источник ↗</a></div><div class="market-card"><div class="eyebrow2">Документы</div><h3>Согласование</h3><p>Диадок ведёт маршруты согласования документов и договоров.</p><a href="https://kontur.ru/diadoc/spravka/21017-elektronnoe_soglasovanie_dokumentov_i_dogovorov" target="_blank" rel="noopener noreferrer">Источник ↗</a></div><div class="market-card"><div class="eyebrow2">Защита</div><h3>Комнаты данных</h3><p>VDR уже дают доступ по ролям, журнал действий и защищённый обмен.</p><a href="https://vdrcloud.ru/" target="_blank" rel="noopener noreferrer">Источник ↗</a></div></div><div class="callout">Наше предполагаемое отличие: связать ранние переговоры, источники, повестки, протоколы, обязательства и персональный доступ в одном пространстве. Это гипотеза позиционирования, которую нужно проверить в пилотах.</div>`},
      {label:'Покупатель',html:`<div class="eyebrow">Для кого</div><h2>Сначала сложные сделки и проекты</h2><div class="grid3"><div class="card"><div class="k">01 / КОМПАНИЯ</div><h3>Собственник и руководитель</h3><p>Несколько долгих сделок, много участников и решений. Нужна честная картина хода проекта без ручного сбора переписки.</p></div><div class="card"><div class="k">02 / КОНСАЛТИНГ</div><h3>Юристы и проектные консультанты</h3><p>Ведут клиентские проекты, готовят повестки, фиксируют договорённости и передают проверяемый результат.</p></div><div class="card"><div class="k">03 / ДВЕ СТОРОНЫ</div><h3>Совместный проект</h3><p>Компаниям нужен общий порядок обсуждения условий при сохранении отдельных внутренних материалов.</p></div></div><div class="quote">Покупатель платит за меньшее число потерянных договорённостей и более управляемое исполнение.</div><p class="mini">Модель оплаты пока гипотеза: команда и активные сделки, с отдельным объёмом обработки записей и подключений. Цены определяются после платных пилотов.</p>`},
      {label:'Архитектура',html:`<div class="eyebrow">Место рядом с CRM</div><h2>Память клиента и память сделки связаны</h2><div class="split"><div class="panel"><div class="eyebrow2">ПРИВЫЧНАЯ CRM</div><h3>Кому продаём</h3><p>Компании, контакты, стадии, суммы, базовые задачи и история отношений.</p><div class="status-line"><span>Битрикс24</span><span>YouGile</span><span>Открытая CRM</span></div></div><div class="panel panel-light"><div class="eyebrow2">НАШ ПОРТАЛ</div><h3>Что произошло по конкретной сделке</h3><p>Источники, хронология, версии условий, повестки, протоколы, обязательства, права сторон и ответы с подтверждением.</p></div></div><div class="quote">Портал может подключаться к действующей CRM или работать с минимальной собственной клиентской базой.</div><p class="mini">Кодовая основа ещё не выбрана. Пилот может использовать готовую открытую CRM или лёгкий собственный модуль. Интеграция с Битрикс24 требует проверки условий доступа к API действующего тарифа.</p>`},
      {label:'Пилот',html:`<div class="eyebrow">Ближайший шаг</div><h2>Показать пользу на одной реальной сделке</h2><div class="road"><div class="card"><big>1</big><h3>Собрать основу</h3><p>Карточка сделки, роли, документы, ручной ввод, хронология и теги.</p></div><div class="card"><big>2</big><h3>Запустить цикл</h3><p>Почта или Telegram, повестка, проект протокола, поручения и отчёт руководителю.</p></div><div class="card"><big>3</big><h3>Проверить спрос</h3><p>Одна команда и одна сделка. Измерить полноту истории, время подготовки документов и готовность платить.</p></div></div><div class="callout">Рабочий демонстрационный пилот можно планировать как короткие итерации в течение недель. Объём автоматических интеграций, двусторонний доступ и требования безопасности уточняются на конкретном проекте.</div>`},
      {label:'Перспектива',html:`<div class="eyebrow">Развитие</div><h2>От одного проекта к новому рабочему стандарту</h2><div class="grid3"><div class="card"><div class="k">СЕЙЧАС</div><h3>Управляемая история</h3><p>Источники, хронология, повестки, протоколы, поручения и отчёты для одной компании.</p></div><div class="card"><div class="k">СЛЕДУЮЩИЙ ЭТАП</div><h3>Общая сделка</h3><p>Две стороны, согласование документов, закрытые слои, журнал действий и переносимый архив.</p></div><div class="card"><div class="k">ПОЗЖЕ</div><h3>Личный агент</h3><p>Помощник в телефоне и компьютере, дополнительные каналы, шаблоны отраслей и расширенная проверка действий.</p></div></div><div class="quote">Цель продукта: чтобы решение, принятое сегодня, оставалось понятным и проверяемым через месяцы.</div><p class="mini">Неизменяемый журнал важен с начала. Блокчейн можно рассматривать позже, если для него появится отдельная практическая задача.</p>`},
      {label:'Источники и вывод',html:`<div class="eyebrow">Итог</div><h2>История сделки становится рабочим активом</h2><p class="lead">Портал задуман как пространство, в котором можно увидеть происхождение условий, смысл решений и следующий ответственный шаг. Первая версия должна доказать эту пользу на реальном проекте.</p><div class="panel"><div class="eyebrow2">ОСНОВА ПРЕЗЕНТАЦИИ</div><h3>Концепция и проверенные рыночные сигналы</h3><p>Содержание опирается на зафиксированную концепцию проекта. Описания действующих функций рынка проверены по страницам самих поставщиков. Коммерческий спрос и отличия продукта остаются гипотезами до пилотов.</p><div class="source-list"><a href="https://helpdesk.bitrix24.ru/open/27105168/" target="_blank" rel="noopener noreferrer">Битрикс24: ИИ в CRM ↗</a><a href="https://ru.yougile.com/crm" target="_blank" rel="noopener noreferrer">YouGile: CRM ↗</a><a href="https://kontur.ru/talk/spravka/80987-tolk_nauchilsya_gotovit_protokol_vstrechi" target="_blank" rel="noopener noreferrer">Контур.Толк: протокол встречи ↗</a><a href="https://kontur.ru/diadoc/spravka/21017-elektronnoe_soglasovanie_dokumentov_i_dogovorov" target="_blank" rel="noopener noreferrer">Диадок: согласование ↗</a><a href="https://vdrcloud.ru/" target="_blank" rel="noopener noreferrer">ЭВРИТЕГ: комната данных ↗</a><a href="https://docs.frappe.io/crm/deal" target="_blank" rel="noopener noreferrer">Frappe CRM: модель сделки ↗</a></div></div>`}
    ];
    const demoData={
      story:[
        {k:'ДЕНЬ 1 · ПОЧТА',h:'Поступило первое предложение',p:'Портал сохраняет письмо и вложение. В истории появляется предложение по цене и срокам со ссылкой на конкретный оригинал. Статус: «предложено», а не «согласовано».',tags:['Письмо','Версия условий 1','Автор и время']},
        {k:'ДЕНЬ 3 · TELEGRAM',h:'Партнёр предлагает другой срок',p:'Сообщение связывается с той же темой сделки. Портал показывает изменение позиции и открытый вопрос: какую дату стороны примут в договор.',tags:['Чат','Изменение срока','Открытый вопрос']},
        {k:'ДЕНЬ 5 · ВСТРЕЧА',h:'Обсуждение становится протоколом',p:'Из записи или заметок готовится проект протокола. Участники проверяют формулировку: что предложено, что согласовано и что осталось спорным.',tags:['Повестка','Проект протокола','Проверка человеком']},
        {k:'ДЕНЬ 6 · ПОДТВЕРЖДЕНИЕ',h:'Есть решение и ответственный',p:'После явного подтверждения срок переходит в реестр условий, а поручение получает исполнителя, дедлайн и ссылку на пункт протокола.',tags:['Подтверждено','Поручение','Источник решения']}
      ],
      sources:[
        {k:'СОГЛАСОВАННЫЙ ЧАТ',h:'Telegram',p:'Сообщения, файлы и голосовые заметки относятся к конкретной сделке. Подключение требует надлежащих прав. Историю до подключения обычный бот может не получить.',tags:['Сообщение','Файл','Дата']},
        {k:'ПРОЕКТНЫЙ АДРЕС И РАЗРЕШЁННЫЕ ЯЩИКИ',h:'Электронная почта',p:'Письмо сохраняется вместе с адресатами, цепочкой и вложениями. В портал попадает только переписка, отнесённая к проекту.',tags:['Цепочка','Вложение','Участники']},
        {k:'ЗАПИСАННАЯ ВСТРЕЧА',h:'Zoom',p:'При наличии прав и записи портал получает видео или аудио, транскрипт и сведения о встрече. Начальный путь — обработка после завершения разговора.',tags:['Запись','Транскрипт','Фрагмент']},
        {k:'ОФЛАЙН-КОНТАКТ',h:'Заметка или диктофон',p:'Сотрудник вносит резюме звонка или очной встречи либо загружает запись. Без первичной записи текст помечается как заметка участника.',tags:['Ручной ввод','Источник указан','Проверка']}
      ],
      meeting:[
        {k:'ДО ВСТРЕЧИ',h:'Повестка',p:'Из предыдущего протокола переходят открытые вопросы. По каждой теме указаны материалы, ответственный за подготовку и ожидаемый результат.',tags:['Тема','Материалы','Ожидаемый результат']},
        {k:'ВО ВРЕМЯ И ПОСЛЕ',h:'Встреча и первоисточник',p:'Запись, расшифровка или заметки связываются с пунктами повестки. Для важных фраз сохраняется возможность перейти к соответствующему фрагменту.',tags:['Участники','Запись или заметка','Время']},
        {k:'ПОСЛЕ ПРОВЕРКИ',h:'Протокол',p:'В проекте отдельно видны предложения, согласованные решения и открытые вопросы. Значимые формулировки подтверждаются человеком; молчание не означает согласия.',tags:['Проект','Согласование','Версия']},
        {k:'СЛЕДУЮЩИЙ ШАГ',h:'Поручения и новая повестка',p:'Каждое поручение получает исполнителя, срок и ожидаемый результат. Нерешённые вопросы автоматически предлагаются для следующей повестки.',tags:['Исполнитель','Срок','Следующая встреча']}
      ],
      roles:[
        {k:'УПРАВЛЕНИЕ',h:'Что происходит и где риск?',p:'Короткая сводка: стадия сделки, последние подтверждённые решения, просроченные поручения, спорные условия и вопросы, требующие внимания директора.',tags:['Состояние','Риски','Ссылки на доказательства']},
        {k:'ИСПОЛНЕНИЕ',h:'Что готовить к следующей встрече?',p:'Повестка из открытых пунктов, список материалов, ответственные, сроки, актуальные версии документов и проект протокола после встречи.',tags:['Повестка','Поручения','Документы']},
        {k:'ПЕРЕГОВОРЫ И ДЕНЬГИ',h:'Как менялись условия?',p:'История предложений по цене, срокам и объёму, коммерческие письма и черновики ответов. Финансовые суммы показаны с источником и статусом проверки.',tags:['Условия','Переписка','Финансы']},
        {k:'СОВМЕСТНАЯ РАБОТА',h:'Что подтверждено сторонами?',p:'Партнёр видит общую повестку, согласованные версии документов, принятые решения и только те поручения, которые относятся к его участию.',tags:['Общее пространство','Согласовано','Ограниченный доступ']}
      ],
      access:[
        {k:'ВОПРОС АГЕНТУ: «ЧТО РЕШИЛИ ПО ЦЕНЕ?»',h:'Руководитель',p:'«Стороны подтвердили диапазон на встрече 12 сентября. Внутренняя оценка маржи ещё обсуждается. Вот пункт протокола, письмо с предложением и закрытый расчёт вашей компании».',tags:['Общие материалы','Внутренний расчёт','Источники']},
        {k:'ТОТ ЖЕ ВОПРОС',h:'Исполнитель',p:'«Стороны подтвердили диапазон на встрече 12 сентября. Ниже пункт протокола и ваша задача подготовить новую редакцию коммерческого предложения».',tags:['Разрешённый протокол','Своя задача','Без закрытой маржи']},
        {k:'ТОТ ЖЕ ВОПРОС',h:'Приглашённый партнёр',p:'«В общей части сделки подтверждён диапазон. Вот согласованный пункт протокола». Внутренний расчёт другой стороны и закрытые заметки не выдаются даже в пересказе.',tags:['Только общая часть','Согласованный источник','Без чужих заметок']}
      ]
    };
    const stage=document.getElementById('stage'),count=document.getElementById('count'),progress=document.getElementById('progress'),prev=document.getElementById('prev'),next=document.getElementById('next'),jump=document.getElementById('jump');
    jump.innerHTML=slides.map((s,i)=>`<option value="${i}">${String(i+1).padStart(2,'0')} · ${s.label}</option>`).join('');
    let current=Math.min(Math.max(parseInt(location.hash.slice(1),10)||1,1),slides.length)-1;
    function showDemo(group,index){const data=demoData[group]?.[index],panel=stage.querySelector(`[data-panel="${group}"]`);if(!data||!panel)return;stage.querySelectorAll(`[data-group="${group}"]`).forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.index)===index)));panel.innerHTML=`<div class="demo-k">${data.k}</div><h3>${data.h}</h3><p>${data.p}</p><div class="status-line">${data.tags.map(t=>`<span>${t}</span>`).join('')}</div>`;}
    function render(){stage.innerHTML=slides[current].html;count.textContent=`${String(current+1).padStart(2,'0')} / ${String(slides.length).padStart(2,'0')}`;progress.style.width=`${(current+1)/slides.length*100}%`;prev.disabled=current===0;next.disabled=current===slides.length-1;jump.value=String(current);location.hash=String(current+1);const first=stage.querySelector('[data-group]');if(first)showDemo(first.dataset.group,0);window.scrollTo({top:0,behavior:'instant'});}
    function go(n){if(n>=0&&n<slides.length){current=n;render()}}
    prev.addEventListener('click',()=>go(current-1));next.addEventListener('click',()=>go(current+1));jump.addEventListener('change',()=>go(Number(jump.value)));
    stage.addEventListener('click',e=>{const button=e.target.closest('[data-group]');if(button)showDemo(button.dataset.group,Number(button.dataset.index))});
    document.addEventListener('keydown',e=>{if(['SELECT','INPUT','TEXTAREA'].includes(e.target.tagName))return;if(['ArrowRight','PageDown'].includes(e.key))go(current+1);if(['ArrowLeft','PageUp'].includes(e.key))go(current-1)});
    window.addEventListener('hashchange',()=>{const n=parseInt(location.hash.slice(1),10);if(n>=1&&n<=slides.length&&n-1!==current)go(n-1)});
    render();
  </script>
